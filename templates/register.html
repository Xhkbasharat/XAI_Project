<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(
135deg,
#020617,
#071427,
#0b1d34
);

color:white;
}

.card{

width:420px;

padding:40px;

border-radius:30px;

background:
rgba(12,20,36,.9);

border:
1px solid rgba(255,255,255,.08);

box-shadow:
0 0 30px rgba(14,165,255,.15);
}

.card h1{

text-align:center;
margin-bottom:10px;
font-size:38px;
}

.card p{

text-align:center;
color:#94a3b8;
margin-bottom:30px;
}

.input-box{

width:100%;

padding:18px;

margin-bottom:18px;

border:none;
outline:none;

border-radius:18px;

background:#111c2f;
color:white;
font-size:16px;
}

.btn{

width:100%;

padding:18px;

border:none;
cursor:pointer;

border-radius:18px;

font-size:18px;
font-weight:bold;

background:
linear-gradient(
90deg,
#0ea5ff,
#2563eb
);

color:white;
}

.login-link{

text-align:center;
margin-top:20px;
}

.login-link a{

color:#38bdf8;
text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

<h1>
👤 Create Account
</h1>

<p>
Register to access AI Pneumonia Dashboard
</p>

<form action="/register" method="POST">

<input
type="text"
name="username"
placeholder="Username"
class="input-box"
required>

<input
type="email"
name="email"
placeholder="Email"
class="input-box"
required>

<input
type="password"
name="password"
placeholder="Password"
class="input-box"
required>

<button
type="submit"
class="btn">

<i class="fa-solid fa-user-plus"></i>
Create Account

</button>

</form>

<div class="login-link">

<a href="/login">

Back to Login

</a>

</div>

</div>

</body>
</html>

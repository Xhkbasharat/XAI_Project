<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Patient History
</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#07111d;
color:white;
padding:40px;
}

.title{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.title h1{
font-size:42px;
color:#14b8ff;
}

.back-btn{
padding:14px 25px;
border:none;
border-radius:14px;
cursor:pointer;
font-size:18px;
font-weight:bold;
background:
linear-gradient(
90deg,
#0ea5ff,
#2563eb
);
color:white;
text-decoration:none;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(350px,1fr));
gap:25px;
}

.card{
background:#0b1b2c;
padding:25px;
border-radius:28px;
box-shadow:
0 0 20px rgba(0,0,0,.3);
}

.card img{
width:100%;
height:250px;
object-fit:contain;
background:#081827;
border-radius:20px;
margin-bottom:20px;
}

.patient-name{
font-size:28px;
font-weight:bold;
margin-bottom:15px;
color:#14b8ff;
}

.info{
line-height:35px;
font-size:18px;
color:#dbeafe;
}

.badge{
display:inline-block;
padding:10px 18px;
border-radius:14px;
font-weight:bold;
margin-top:10px;
}

.pneumonia{
background:#dc2626;
}

.normal{
background:#16a34a;
}

.empty{
text-align:center;
padding:80px;
font-size:28px;
color:#94a3b8;
}

</style>

</head>

<body>

<div class="title">

<h1>
<i class="fa-solid fa-clock-rotate-left"></i>
Patient History
</h1>

<a
href="/dashboard"
class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

Dashboard

</a>

</div>

{% if patients %}

<div class="grid">

{% for p in patients %}

<div class="card">

<img
src="{{ url_for('static', filename='uploads/' + p[6]) }}">

<div class="patient-name">

{{ p[1] }}

</div>

<div class="info">

<b>Age:</b>
{{ p[2] }}

<br>

<b>Gender:</b>
{{ p[3] }}

<br>

<b>Confidence:</b>
{{ p[5] }}%

<br>

<b>Date:</b>
{{ p[7] }}

<br><br>

{% if p[4] == "PNEUMONIA" %}

<span class="badge pneumonia">

⚠ PNEUMONIA

</span>

{% else %}

<span class="badge normal">

✅ NORMAL

</span>

{% endif %}

</div>

</div>

{% endfor %}

</div>

{% else %}

<div class="empty">

No patient history found

</div>

{% endif %}

</body>
</html>
